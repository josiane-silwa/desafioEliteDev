databases:
  - name: bilheteria-db
    plan: free
    databaseName: bilheteria
    user: bilheteria

services:
  # --- Servico unico: Django serve a API (/app/...), o admin (/admin/)
  # e os arquivos ja compilados do React (frontend/dist), commitados no
  # repositorio. Nao ha mais servico separado de frontend. ---
  - type: web
    name: bilheteria
    runtime: python
    plan: free
    # manage.py fica na raiz do repositorio (a pasta "backend/" e so o
    # pacote de settings/urls).
    buildCommand: "bash build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: bilheteria.onrender.com
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bilheteria-db
          property: connectionString