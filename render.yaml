databases:
  - name: bilheteria-db
    plan: free
    databaseName: bilheteria
    user: bilheteria

services:
  # --- Backend Django ---
  - type: web
    name: bilheteria-backend
    runtime: python
    plan: free
    # manage.py fica na raiz do repositório (a pasta "backend/" é só o
    # pacote de settings/urls). Ajuste rootDir aqui se o seu repositório
    # tiver back-end e front-end em pastas separadas dentro de um monorepo.
    buildCommand: "build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: bilheteria-backend.onrender.com
      - key: FRONTEND_URL
        value: https://bilheteria-frontend.onrender.com
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bilheteria-db
          property: connectionString

  # --- Frontend React (Vite) ---
  - type: web
    name: bilheteria-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL_DEPLOY
        value: https://bilheteria-backend.onrender.com/app/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html